name: match-pipeline

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday, 6am UTC
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      PYTHONPATH: ${{ github.workspace }}
      FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest matches from football-data.org
        run: python src/ingestion/football_data_org.py

      - name: Train match outcome model
        run: python src/models/match_outcome/train.py

      - name: Predict match outcomes
        run: python src/models/match_outcome/predict.py
