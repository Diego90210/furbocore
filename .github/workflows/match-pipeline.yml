name: match-pipeline

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday, 6am UTC
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest matches
        id: ingest
        continue-on-error: true
        run: python src/ingestion/matches_and_elo.py

      - name: Build features
        if: steps.ingest.outcome == 'success'
        run: python -c "from src.features.match_outcome import build_training_set; build_training_set()"

      - name: Train model
        if: steps.ingest.outcome == 'success'
        run: python src/models/match_outcome/train.py

      - name: Predict and upsert
        if: steps.ingest.outcome == 'success'
        run: python src/models/match_outcome/predict.py
