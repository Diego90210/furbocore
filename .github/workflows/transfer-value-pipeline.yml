name: transfer-value-pipeline

on:
  schedule:
    - cron: '0 6 1 * *'  # Day 1 of each month, 6am UTC
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      PYTHONPATH: ${{ github.workspace }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest player stats from Kaggle
        run: python src/ingestion/player_stats_kaggle.py

      - name: Ingest Transfermarkt data
        run: python src/ingestion/transfermarkt_values.py

      - name: Train and predict transfer values
        run: python src/models/transfer_value/run_pipeline.py

      - name: Train scouting clusters
        run: python src/models/scouting/train.py

      - name: Assign clusters and upsert
        run: python src/models/scouting/predict.py
